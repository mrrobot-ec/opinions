[package]
name = "simswarm"
version = "0.1.0"
edition.workspace = true
publish = false

# OUTER TEST HARNESS (Phase 6 D28): no internal crate dependencies — the swarm
# drives the system through the public REST/WS API only. Wire DTOs are local
# serde structs; drift versus openapi.json is caught by a contract test.

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
rand = "0.8"
rand_chacha = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "signal"] }
tokio-tungstenite = "0.24"
uuid = { version = "1", features = ["serde", "v4"] }
