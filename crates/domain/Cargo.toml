[package]
name = "domain"
version = "0.1.0"
edition.workspace = true
# Proprietary, never published; lets cargo-deny's licenses.private.ignore skip it.
publish = false

[dependencies]
sha2 = "0.10"
thiserror = "2"
unicode-general-category = "1"
unicode-normalization = "0.1"
uuid = { version = "1", default-features = false }

[dev-dependencies]
proptest = "1"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
