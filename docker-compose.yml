services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: opinions, POSTGRES_PASSWORD: opinions, POSTGRES_DB: opinions }
    ports: ["15434:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  nats:
    image: nats:2-alpine
    command: ["-js"]
    ports: ["4222:4222"]
