[project]
name = "converse"
version = "0.1.0"
description = "iMessage conversation service — FastAPI + LangGraph skeleton (Phase 0)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "pydantic>=2",
  "asyncpg",
  "httpx",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "anyio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/converse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires DATABASE_URL (skipped otherwise)",
]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.64.0",
]
